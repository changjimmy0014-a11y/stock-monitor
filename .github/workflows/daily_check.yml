name: Stock Monitor Daily Check

on:
  schedule:
    # 💡 一天執行兩次 (週一至週五)
    # 1. 台灣時間 12:30 (UTC 04:30) -> 掌握盤中即時動態
    # 2. 台灣時間 13:15 (UTC 05:15) -> 鎖定收盤價，完美銜接 13:40 盤後零股
    - cron: '30 04,15 05 * * 1-5'
    
  workflow_dispatch: # 允許隨時手動點擊測試

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests google-genai

      - name: Run script
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python stock_monitor.py
